# Pre-domain / no-TLS variant: run ONLY the app, published on public port 80 as
# plain HTTP + ws:// (no Caddy, no certificate). Use this to validate end-to-end
# over ws://<public-ip>/ws before a domain + TLS is ready; switch to
# docker-compose.yml (Caddy auto-TLS WSS) once DNS points at this host.
#
#   cp .env.example .env && <edit .env> \
#     && docker compose -f deploy/docker-compose.no-tls.yml up -d --build
#
# Then: ESP32 ws_url = ws://<public-ip>/ws ; console = http://<public-ip>/console
# (browser mic needs a secure context, so the simulator/voice pages won't capture
#  mic over http://<ip>; use the real device, or SSH-tunnel to localhost — see the
#  runbook "无域名先验证" section.)

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    ports:
      - "80:8090" # public plain HTTP/ws (no TLS); security group must allow 80
    volumes:
      - vr-runtime:/app/runtime

volumes:
  vr-runtime:
