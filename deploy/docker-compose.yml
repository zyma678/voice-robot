# Single-ECS deploy: app (uvicorn) behind Caddy (auto-TLS reverse proxy → WSS).
# Caddy obtains a Let's Encrypt cert for $VR_DOMAIN and transparently proxies the
# /ws WebSocket. Only 80/443 are published; the app port stays internal.
#
#   cp .env.example .env && <edit .env> && docker compose -f deploy/docker-compose.yml up -d
#
# Build context is the repo root (..) so the Dockerfile can COPY voice_robot/ and
# web_console/. See ../.dockerignore for what is excluded from the context.

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    expose:
      - "8090" # internal only; reached via the caddy service, not published
    volumes:
      - vr-runtime:/app/runtime # memory + console_settings.json persist here

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - VR_DOMAIN=${VR_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data # ACME account + issued certs (persist!)
      - caddy-config:/config
    depends_on:
      - app

volumes:
  vr-runtime:
  caddy-data:
  caddy-config:
